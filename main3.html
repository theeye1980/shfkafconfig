  <!DOCTYPE html>
  <html lang="ru">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конфигуратор шкафчика в нишу</title>
  <link rel="stylesheet" href="style.css">
  </head>
  <body>

  <div class="app">
    <!-- ===== ПАНЕЛЬ УПРАВЛЕНИЯ ===== -->
    <div class="panel" id="panel">
      <h2>⚙️ Параметры шкафчика</h2>

      <!-- Высота -->
      <div class="control-group">
        <label>Высота ниши</label>
        <div class="slider-row">
          <input type="range" id="sliderHeight" min="90" max="170" value="110" step="1">
          <span class="slider-value" id="valHeight">110 см</span>
        </div>
      </div>

      <!-- Ширина -->
      <div class="control-group">
        <label>Ширина ниши</label>
        <div class="slider-row">
          <input type="range" id="sliderWidth" min="70" max="150" value="90" step="1">
          <span class="slider-value" id="valWidth">90 см</span>
        </div>
      </div>

      <!-- Глубина -->
      <div class="control-group">
        <label>Глубина ниши</label>
        <div class="slider-row">
          <input type="range" id="sliderDepth" min="18" max="40" value="30" step="1">
          <span class="slider-value" id="valDepth">30 см</span>
        </div>
      </div>

      <!-- === СЕКЦИЯ: корпус === -->
      <div class="section-title">Корпус</div>

      <div class="control-group">
        <label>Материал корпуса</label>
        <div class="radio-group">
          <input type="radio" name="bodyType" id="bodyLDSP" value="ldsp" checked>
          <label for="bodyLDSP">ЛДСП</label>
          <input type="radio" name="bodyType" id="bodyShield" value="shield">
          <label for="bodyShield">Мебельный щит</label>
        </div>
      </div>

      <div class="control-group" id="bodyColorGroup">
          <label>Цвет корпуса</label>
          <div class="color-palette" id="paletteBody"></div>
      </div>
      <!-- === СЕКЦИЯ: СТВОРКИ === -->
      <div class="section-title">Створки</div>

      <div class="control-group">
        <label>Количество створок</label>
        <div class="counter">
          <button id="doorsMin">−</button>
          <span class="counter-value" id="valDoors">2</span>
          <button id="doorsPlus">+</button>
        </div>
      </div>

      <div class="control-group">
        <label>Тип створок</label>
        <div class="radio-group">
          <input type="radio" name="doorType" id="doorLDSP" value="ldsp" checked>
          <label for="doorLDSP">ЛДСП</label>
          <input type="radio" name="doorType" id="doorJaluzi" value="jaluzi">
          <label for="doorJaluzi">Жалюзи</label>
        </div>
      </div>

      <div class="control-group">
      <label>Высота створки</label>
      <div class="slider-row">
          <input type="range" id="sliderDoorH" min="60" max="130" value="76" step="1">
          <span class="slider-value" id="valDoorH">76 см</span>
      </div>
      </div>

      <div class="info-text" id="infoDoorHeight">Открытая полка снизу: нет</div>

      <div class="control-group" id="doorColorGroup">
        <label>Цвет створок</label>
        <div class="color-palette" id="paletteDoor"></div>
      </div>
      
      <div class="control-group">
        <label class="checkbox-row">
          <input type="checkbox" id="chkSideShelf" checked>
          Боковая полка
        </label>
      </div>

      <div class="sub-group" id="sideShelfOptions">
        <div class="control-group">
          <label>Сторона</label>
          <div class="radio-group">
            <input type="radio" name="sideShelfSide" id="sideLeft" value="left" checked>
            <label for="sideLeft">Слева</label>
            <input type="radio" name="sideShelfSide" id="sideRight" value="right">
            <label for="sideRight">Справа</label>
          </div>
        </div>
        <div class="control-group">
          <label>Ширина боковой полки</label>
          <div class="slider-row">
            <input type="range" id="sliderSideShelfW" min="15" max="27" value="20" step="1">
            <span class="slider-value" id="valSideShelfW">20 см</span>
          </div>
        </div>
        <div class="control-group">
          <label>Полок в боковой секции</label>
          <div class="counter">
            <button id="sideShelvesMinus">−</button>
            <span class="counter-value" id="valSideShelves">2</span>
            <button id="sideShelvesPlus">+</button>
          </div>
        </div>
      </div>



      <!-- Цена -->
      <div class="price-block" id="priceBlock"></div>

      <!-- Кнопка заявки -->
      <button class="btn-order" id="btnOrder">📩 Оставить заявку</button>
    </div>

    <!-- ===== ОБЛАСТЬ ВИЗУАЛИЗАЦИИ ===== -->
    <div class="viewport">
      <div class="svg-container" id="svgContainer">
        <svg id="cabinetSVG" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="info-panel" id="infoPanel"></div>
    </div>
  </div>

  <!-- ===== МОДАЛЬНОЕ ОКНО ЗАЯВКИ ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Оставить заявку</h2>
      <div class="form-group">
        <label>Ваше имя</label>
        <input type="text" id="inputName" placeholder="Имя">
      </div>
      <div class="form-group">
        <label>Телефон</label>
        <input type="tel" id="inputPhone" placeholder="+7 (___) ___-__-__">
      </div>
      <div class="form-group">
        <label>Комментарий</label>
        <textarea id="inputComment" placeholder="Пожелания, адрес, размеры ниши..."></textarea>
      </div>
      <div id="modalConfig" style="font-size:11px;color:#999;margin-top:8px;"></div>
      <div class="modal-buttons">
        <button class="btn-cancel" id="btnCancel">Отмена</button>
        <button class="btn-send" id="btnSend">Отправить</button>
      </div>
    </div>
  </div>


  <script src="config.js"></script>
  <script src="state.js"></script>
  <script src="render-svg.js"></script>
  <script src="price.js"></script>
  <script src="modal.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
  </body>
  </html>
