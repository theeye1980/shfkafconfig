<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конфигуратор шкафчика в нишу</title>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f0f0;
  color: #333;
  min-height: 100vh;
}

/* ===== LAYOUT ===== */
.app {
  display: flex;
  flex-direction: row;
  min-height: 100vh;
}

/* Панель управления */
.panel {
  width: 360px;
  min-width: 360px;
  background: #fff;
  padding: 20px;
  overflow-y: auto;
  border-right: 1px solid #ddd;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Область визуализации */
.viewport {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 30px 20px;
  gap: 20px;
}

/* ===== ПАНЕЛЬ: ЭЛЕМЕНТЫ ===== */
.panel h2 {
  font-size: 18px;
  border-bottom: 2px solid #e0e0e0;
  padding-bottom: 8px;
  margin-bottom: 4px;
}

.section-title {
  font-size: 14px;
  font-weight: 700;
  color: #4a7c59;
  margin-top: 6px;
  padding-top: 8px;
  border-top: 1px dashed #ccc;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.control-group label {
  font-size: 13px;
  font-weight: 600;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.slider-row input[type="range"] {
  flex: 1;
  accent-color: #4a7c59;
}

.slider-value {
  min-width: 52px;
  text-align: right;
  font-weight: 700;
  font-size: 15px;
  color: #222;
}

/* Счётчик +/- */
.counter {
  display: flex;
  align-items: center;
  gap: 8px;
}

.counter button {
  width: 32px;
  height: 32px;
  border: 1px solid #ccc;
  background: #f5f5f5;
  border-radius: 6px;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}

.counter button:hover { background: #e0e0e0; }
.counter button:active { background: #d0d0d0; }

.counter .counter-value {
  font-size: 18px;
  font-weight: 700;
  min-width: 24px;
  text-align: center;
}

/* Радиокнопки */
.radio-group {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.radio-group label {
  flex: 1;
  min-width: 60px;
  text-transform: none;
  font-weight: 500;
  font-size: 13px;
  padding: 8px 10px;
  border: 2px solid #ddd;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}

.radio-group input { display: none; }
.radio-group input:checked + label {
  border-color: #4a7c59;
  background: #e8f5e9;
  color: #2e5a3a;
}

/* Палитра цветов */
.color-palette {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.color-swatch {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: 3px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}

.color-swatch:hover { transform: scale(1.1); }
.color-swatch.active { border-color: #4a7c59; box-shadow: 0 0 0 2px #4a7c59; }

.color-swatch .tooltip {
  position: absolute;
  bottom: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  white-space: nowrap;
  background: #333;
  color: #fff;
  padding: 2px 6px;
  border-radius: 3px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
  z-index: 10;
}

.color-swatch:hover .tooltip { opacity: 1; }

/* Чекбокс стилизованный */
.checkbox-row {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}

.checkbox-row input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: #4a7c59;
  cursor: pointer;
}

/* Подгруппа — вложенные параметры */
.sub-group {
  margin-left: 12px;
  padding-left: 12px;
  border-left: 2px solid #e0e0e0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.sub-group.hidden { display: none; }

/* Инфо-текст */
.info-text {
  font-size: 12px;
  color: #888;
  font-style: italic;
}

/* ===== ЦЕНА ===== */
.price-block {
  background: #f8faf8;
  border: 1px solid #d4e5d8;
  border-radius: 10px;
  padding: 16px;
}

.price-block h3 {
  font-size: 14px;
  color: #555;
  margin-bottom: 8px;
}

.price-line {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 3px 0;
  color: #666;
}

.price-total {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  font-weight: 800;
  color: #2e5a3a;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 2px solid #4a7c59;
}

/* Кнопка заявки */
.btn-order {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  background: #4a7c59;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s;
  letter-spacing: 0.5px;
}

.btn-order:hover { background: #3d6a4b; }
.btn-order:active { background: #2e5a3a; }

/* ===== SVG VIEWPORT ===== */
.svg-container {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  padding: 20px;
  width: 100%;
  max-width: 750px;
}

.svg-container svg {
  width: 100%;
  height: auto;
}

/* ===== МОДАЛЬНОЕ ОКНО ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal-overlay.show { display: flex; }

.modal {
  background: #fff;
  border-radius: 14px;
  padding: 30px;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

.modal h2 {
  margin-bottom: 16px;
  font-size: 20px;
}

.modal .form-group {
  margin-bottom: 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.modal .form-group label {
  font-size: 13px;
  font-weight: 600;
  color: #555;
}

.modal .form-group input,
.modal .form-group textarea {
  padding: 10px 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
}

.modal .form-group textarea {
  resize: vertical;
  min-height: 60px;
}

.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.modal-buttons button {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
}

.btn-send {
  background: #4a7c59;
  color: #fff;
}

.btn-send:hover { background: #3d6a4b; }

.btn-cancel {
  background: #e0e0e0;
  color: #333;
}

.btn-cancel:hover { background: #d0d0d0; }

/* ===== RESPONSIVE ===== */
@media (max-width: 800px) {
  .app {
    flex-direction: column;
  }

  .panel {
    width: 100%;
    min-width: unset;
    border-right: none;
    border-bottom: 1px solid #ddd;
    order: 2;
  }

  .viewport {
    order: 1;
    padding: 16px 12px;
  }
}
</style>
</head>
<body>

<div class="app">
  <!-- ===== ПАНЕЛЬ УПРАВЛЕНИЯ ===== -->
  <div class="panel" id="panel">
    <h2>⚙️ Параметры шкафчика</h2>

    <!-- Высота -->
    <div class="control-group">
      <label>Высота</label>
      <div class="slider-row">
        <input type="range" id="sliderHeight" min="90" max="140" value="110" step="1">
        <span class="slider-value" id="valHeight">110 см</span>
      </div>
    </div>

    <!-- Ширина -->
    <div class="control-group">
      <label>Ширина</label>
      <div class="slider-row">
        <input type="range" id="sliderWidth" min="70" max="120" value="90" step="1">
        <span class="slider-value" id="valWidth">90 см</span>
      </div>
    </div>

    <!-- Глубина -->
    <div class="control-group">
      <label>Глубина ниши</label>
      <div class="slider-row">
        <input type="range" id="sliderDepth" min="18" max="40" value="30" step="1">
        <span class="slider-value" id="valDepth">30 см</span>
      </div>
    </div>

    <!-- === СЕКЦИЯ: БОКОВАЯ ПОЛКА === -->
    <div class="section-title">Боковая открытая полка</div>

    <div class="control-group">
      <label class="checkbox-row">
        <input type="checkbox" id="chkSideShelf" checked>
        Добавить боковую полку
      </label>
    </div>

    <div class="sub-group" id="sideShelfOptions">
      <!-- Сторона -->
      <div class="control-group">
        <label>Сторона</label>
        <div class="radio-group">
          <input type="radio" name="sideShelfSide" id="sideLeft" value="left" checked>
          <label for="sideLeft">Слева</label>
          <input type="radio" name="sideShelfSide" id="sideRight" value="right">
          <label for="sideRight">Справа</label>
        </div>
      </div>
      <!-- Ширина боковой полки -->
      <div class="control-group">
        <label>Ширина боковой полки</label>
        <div class="slider-row">
          <input type="range" id="sliderSideShelfW" min="17" max="25" value="20" step="1">
          <span class="slider-value" id="valSideShelfW">20 см</span>
        </div>
      </div>
      <!-- Кол-во полок в боковой секции -->
      <div class="control-group">
        <label>Полок в боковой секции</label>
        <div class="counter">
          <button id="sideShelvesMinus">−</button>
          <span class="counter-value" id="valSideShelves">2</span>
          <button id="sideShelvesPlus">+</button>
        </div>
      </div>
    </div>

    <!-- === СЕКЦИЯ: СТВОРКИ === -->
    <div class="section-title">Створки</div>

    <!-- Количество створок -->
    <div class="control-group">
      <label>Количество створок</label>
      <div class="counter">
        <button id="doorsMin">−</button>
        <span class="counter-value" id="valDoors">2</span>
        <button id="doorsPlus">+</button>
      </div>
    </div>

    <!-- Высота створок -->
    <div class="control-group">
      <label>Высота створок</label>
      <div class="slider-row">
        <input type="range" id="sliderDoorHeight" min="30" max="138" value="76" step="1">
        <span class="slider-value" id="valDoorHeight">76 см</span>
      </div>
      <div class="info-text" id="infoDoorHeight">Открытая полка снизу: нет</div>
    </div>

    <!-- Тип створок -->
    <div class="control-group">
      <label>Тип створок</label>
      <div class="radio-group">
        <input type="radio" name="doorType" id="doorLDSP" value="ldsp" checked>
        <label for="doorLDSP">ЛДСП</label>
        <input type="radio" name="doorType" id="doorJaluzi" value="jaluzi">
        <label for="doorJaluzi">Жалюзи</label>
      </div>
    </div>

    <!-- === СЕКЦИЯ: ПОЛКИ === -->
    <div class="section-title">Полки (за створками)</div>

    <div class="control-group">
      <label>Количество полок</label>
      <div class="counter">
        <button id="shelvesMin">−</button>
        <span class="counter-value" id="valShelves">2</span>
        <button id="shelvesPlus">+</button>
      </div>
    </div>

    <!-- === СЕКЦИЯ: ЦВЕТА === -->
    <div class="section-title">Цвета</div>

    <!-- Цвет ЛДСП -->
    <div class="control-group">
      <label>Цвет ЛДСП (полки, створки)</label>
      <div class="color-palette" id="paletteLDSP"></div>
    </div>

    <!-- Цвет каркаса -->
    <div class="control-group">
      <label>Каркас (мебельный щит)</label>
      <div class="color-palette" id="paletteFrame"></div>
    </div>

    <!-- Цена -->
    <div class="price-block" id="priceBlock">
      <!-- заполняется JS -->
    </div>

    <!-- Кнопка заявки -->
    <button class="btn-order" id="btnOrder">📩 Оставить заявку</button>
  </div>

  <!-- ===== ОБЛАСТЬ ВИЗУАЛИЗАЦИИ ===== -->
  <div class="viewport">
    <div class="svg-container" id="svgContainer">
      <svg id="cabinetSVG" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
</div>

<!-- ===== МОДАЛЬНОЕ ОКНО ЗАЯВКИ ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Оставить заявку</h2>
    <div class="form-group">
      <label>Ваше имя</label>
      <input type="text" id="inputName" placeholder="Имя">
    </div>
    <div class="form-group">
      <label>Телефон</label>
      <input type="tel" id="inputPhone" placeholder="+7 (___) ___-__-__">
    </div>
    <div class="form-group">
      <label>Комментарий</label>
      <textarea id="inputComment" placeholder="Пожелания, адрес, размеры ниши..."></textarea>
    </div>
    <div id="modalConfig" style="font-size:11px;color:#999;margin-top:8px;"></div>
    <div class="modal-buttons">
      <button class="btn-cancel" id="btnCancel">Отмена</button>
      <button class="btn-send" id="btnSend">Отправить</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIG — все настраиваемые параметры в одном месте
// ============================================================
const CONFIG = {
  orderEndpoint: '/api/order',

  ldspColors: [
    { id: 'white',     name: 'Белый',         hex: '#F5F5F0' },
    { id: 'sonoma',    name: 'Дуб сонома',    hex: '#C8AD7F' },
    { id: 'venge',     name: 'Венге',          hex: '#3E2723' },
    { id: 'buk',       name: 'Бук',            hex: '#D4A76A' },
    { id: 'olha',      name: 'Ольха',          hex: '#B8956A' },
    { id: 'grey',      name: 'Серый',          hex: '#9E9E9E' },
    { id: 'graphite',  name: 'Антрацит',       hex: '#424242' },
    { id: 'oak_dark',  name: 'Дуб тёмный',    hex: '#6D4C2E' },
  ],

  frameColors: [
    { id: 'pine',       name: 'Сосна натуральная',  hex: '#E8D5A3' },
    { id: 'pine_toned', name: 'Сосна тонированная',  hex: '#B8935A' },
    { id: 'birch',      name: 'Берёза',              hex: '#F0E0C0' },
  ],

  nicheColor: '#D5CEC5',
  nicheStroke: '#B0A898',

  prices: {
    framePerM2: 3200,
    ldspPerM2: 1800,
    dvpPerM2: 400,
    jaluziPerDoor: 4500,
    jaluziPerM2: 12000,
    assembly: 2000,
  },

  frameThickness: 1.8,
  shelfThickness: 1.6,
  dividerThickness: 1.8,
  doorThickness: 1.6,
  backThickness: 0.3,

  // Дефолтная высота открытой полки снизу (см) — створки будут на эту величину короче
  defaultBottomOpenHeight: 30,

  svg: {
    width: 700,
    height: 500,
    padding: 60,
    nicheExtraGap: 4,
    dimLineOffset: 20,
    dimColor: '#666',
    dimFontSize: 13,
  }
};

// ============================================================
// STATE — текущее состояние конфигуратора
// ============================================================
const state = {
  height: 110,
  width: 90,
  depth: 30,
  shelves: 2,
  doors: 2,
  doorType: 'ldsp',
  doorHeight: 76,  // будет пересчитано в init
  ldspColorId: 'white',
  frameColorId: 'pine',
  // Боковая полка — включена по умолчанию
  sideShelf: true,
  sideShelfSide: 'left',
  sideShelfWidth: 20,
  sideShelves: 2,
};

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  // Рассчитываем дефолтную высоту створок: innerH - 30 см
  const innerH = state.height - 2 * CONFIG.frameThickness;
  state.doorHeight = Math.max(30, Math.round(innerH - CONFIG.defaultBottomOpenHeight));

  // Синхронизируем слайдер и отображение
  document.getElementById('sliderDoorHeight').value = state.doorHeight;
  document.getElementById('valDoorHeight').textContent = state.doorHeight + ' см';

  buildPalettes();
  bindControls();
  syncDoorHeightLimits();
  render();
});

// ============================================================
// ПАЛИТРЫ ЦВЕТОВ
// ============================================================
function buildPalettes() {
  const palLDSP = document.getElementById('paletteLDSP');
  CONFIG.ldspColors.forEach(c => {
    const div = document.createElement('div');
    div.className = 'color-swatch' + (c.id === state.ldspColorId ? ' active' : '');
    div.style.background = c.hex;
    if (isColorDark(c.hex)) {
      div.style.border = '3px solid ' + (c.id === state.ldspColorId ? '#4a7c59' : '#888');
    }
    div.dataset.id = c.id;
    div.innerHTML = `<span class="tooltip">${c.name}</span>`;
    div.addEventListener('click', () => {
      state.ldspColorId = c.id;
      updatePaletteActive('paletteLDSP', c.id);
      render();
    });
    palLDSP.appendChild(div);
  });

  const palFrame = document.getElementById('paletteFrame');
  CONFIG.frameColors.forEach(c => {
    const div = document.createElement('div');
    div.className = 'color-swatch' + (c.id === state.frameColorId ? ' active' : '');
    div.style.background = c.hex;
    div.dataset.id = c.id;
    div.innerHTML = `<span class="tooltip">${c.name}</span>`;
    div.addEventListener('click', () => {
      state.frameColorId = c.id;
      updatePaletteActive('paletteFrame', c.id);
      render();
    });
    palFrame.appendChild(div);
  });
}

function updatePaletteActive(paletteId, activeId) {
  document.querySelectorAll(`#${paletteId} .color-swatch`).forEach(el => {
    el.classList.toggle('active', el.dataset.id === activeId);
  });
}

function isColorDark(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return (r * 0.299 + g * 0.587 + b * 0.114) < 128;
}

// ============================================================
// ПРИВЯЗКА КОНТРОЛОВ
// ============================================================
function bindControls() {
  bindSlider('sliderHeight', 'valHeight', v => { state.height = v; syncDoorHeightLimits(); }, 'см');
  bindSlider('sliderWidth',  'valWidth',  v => { state.width = v; }, 'см');
  bindSlider('sliderDepth',  'valDepth',  v => { state.depth = v; }, 'см');

  bindSlider('sliderDoorHeight', 'valDoorHeight', v => { state.doorHeight = v; updateDoorHeightInfo(); }, 'см');

  bindCounter('shelvesMin', 'shelvesPlus', 'valShelves', 1, 5,
    () => state.shelves, v => { state.shelves = v; });
  bindCounter('doorsMin', 'doorsPlus', 'valDoors', 1, 4,
    () => state.doors, v => { state.doors = v; });

  document.querySelectorAll('input[name="doorType"]').forEach(radio => {
    radio.addEventListener('change', e => {
      state.doorType = e.target.value;
      render();
    });
  });

  // === Боковая полка ===
  const chk = document.getElementById('chkSideShelf');
  const opts = document.getElementById('sideShelfOptions');
  // Инициализация: чекбокс уже checked, options видимы
  chk.addEventListener('change', () => {
    state.sideShelf = chk.checked;
    opts.classList.toggle('hidden', !chk.checked);
    render();
  });

  document.querySelectorAll('input[name="sideShelfSide"]').forEach(radio => {
    radio.addEventListener('change', e => {
      state.sideShelfSide = e.target.value;
      render();
    });
  });

  bindSlider('sliderSideShelfW', 'valSideShelfW', v => { state.sideShelfWidth = v; }, 'см');

  bindCounter('sideShelvesMinus', 'sideShelvesPlus', 'valSideShelves', 1, 5,
    () => state.sideShelves, v => { state.sideShelves = v; });

  document.getElementById('btnOrder').addEventListener('click', openModal);
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  document.getElementById('btnSend').addEventListener('click', sendOrder);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
}

function bindSlider(sliderId, valId, setter, suffix) {
  const slider = document.getElementById(sliderId);
  const val = document.getElementById(valId);
  slider.addEventListener('input', () => {
    const v = parseInt(slider.value);
    setter(v);
    val.textContent = v + ' ' + suffix;
    render();
  });
}

function bindCounter(minBtnId, plusBtnId, valId, min, max, getter, setter) {
  const valEl = document.getElementById(valId);
  document.getElementById(minBtnId).addEventListener('click', () => {
    let v = getter();
    if (v > min) { setter(v - 1); valEl.textContent = v - 1; render(); }
  });
  document.getElementById(plusBtnId).addEventListener('click', () => {
    let v = getter();
    if (v < max) { setter(v + 1); valEl.textContent = v + 1; render(); }
  });
}

function syncDoorHeightLimits() {
  const slider = document.getElementById('sliderDoorHeight');
  const innerH = state.height - 2 * CONFIG.frameThickness;
  const maxDoorH = Math.floor(innerH);
  slider.max = maxDoorH;
  if (state.doorHeight > maxDoorH) {
    state.doorHeight = maxDoorH;
    slider.value = maxDoorH;
    document.getElementById('valDoorHeight').textContent = maxDoorH + ' см';
  }
  slider.min = 30;
  updateDoorHeightInfo();
}

function updateDoorHeightInfo() {
  const innerH = state.height - 2 * CONFIG.frameThickness;
  const bottomShelfH = innerH - state.doorHeight;
  const info = document.getElementById('infoDoorHeight');
  if (bottomShelfH > 1) {
    info.textContent = `Открытая полка снизу: ${bottomShelfH.toFixed(1)} см`;
    info.style.color = '#4a7c59';
  } else {
    info.textContent = 'Открытая полка снизу: нет';
    info.style.color = '#888';
  }
}

// ============================================================
// РЕНДЕР
// ============================================================
function render() {
  renderSVG();
  renderPrice();
}

// ============================================================
// SVG-ВИЗУАЛИЗАЦИЯ
// ============================================================
function renderSVG() {
  const svg = document.getElementById('cabinetSVG');
  const S = CONFIG.svg;
  const frameColor = getFrameHex();
  const ldspColor = getLdspHex();

  const ft = CONFIG.frameThickness;
  const dt = CONFIG.dividerThickness;
  const innerHcm = state.height - 2 * ft;
  const innerWcm = state.width - 2 * ft;

  // Общая ширина конструкции (включая боковую полку)
  const totalWidthCm = state.sideShelf
    ? state.width + dt + state.sideShelfWidth
    : state.width;

  // Масштабирование
  const drawW = S.width - S.padding * 2;
  const drawH = S.height - S.padding * 2;
  const scale = Math.min(drawW / (totalWidthCm + 12), drawH / (state.height + 12));

  const cabW = state.width * scale;
  const cabH = state.height * scale;

  const sideW = state.sideShelf ? (state.sideShelfWidth + dt) * scale : 0;
  const totalW = cabW + sideW;

  const startX = (S.width - totalW) / 2;
  const startY = S.padding + (drawH - cabH) / 2;

  let mainX, sideX;
  if (!state.sideShelf) {
    mainX = startX;
    sideX = 0;
  } else if (state.sideShelfSide === 'left') {
    sideX = startX;
    mainX = startX + sideW;
  } else {
    mainX = startX;
    sideX = startX + cabW;
  }

  const ftPx = ft * scale;
  const dtPx = dt * scale;
  const stPx = CONFIG.shelfThickness * scale;
  const gap = S.nicheExtraGap;

  let parts = [];

  // --- НИША (фон) ---
  // Ниша покрывает всю конструкцию, включая боковую полку
  parts.push(rect(startX - gap, startY - gap, totalW + gap * 2, cabH + gap * 2,
    CONFIG.nicheColor, CONFIG.nicheStroke, 1));

  // ==============================
  // ОСНОВНАЯ СЕКЦИЯ
  // ==============================

  // Высота створок и нижняя открытая полка
  const doorHcm = state.doorHeight;
  const doorHpx = doorHcm * scale;
  const bottomOpenCm = innerHcm - doorHcm;
  const bottomOpenPx = bottomOpenCm * scale;

  // Створки крепятся сверху (от верхней крышки вниз)
  const doorTopY = startY + ftPx;
  const doorBottomY = doorTopY + doorHpx;

  // --- Каркас основной секции ---
  // Левая боковина
  parts.push(rect(mainX, startY, ftPx, cabH, frameColor, darken(frameColor, 30), 1));
  // Правая боковина
  parts.push(rect(mainX + cabW - ftPx, startY, ftPx, cabH, frameColor, darken(frameColor, 30), 1));
  // Верхняя крышка
  parts.push(rect(mainX + ftPx, startY, cabW - 2 * ftPx, ftPx, frameColor, darken(frameColor, 30), 1));

  // Нижняя планка каркаса основной секции
  // Если есть нижняя открытая полка — нижняя планка каркаса остаётся на месте (самый низ)
  parts.push(rect(mainX + ftPx, startY + cabH - ftPx, cabW - 2 * ftPx, ftPx, frameColor, darken(frameColor, 30), 1));

  // --- Разделительная полка между створками и нижней открытой зоной ---
  // Эта полка идёт на ВСЮ ШИРИНУ конструкции (включая боковую секцию)
  if (bottomOpenCm > 1) {
    // Определяем левый и правый край разделительной полки
    let divShelfLeft, divShelfRight;
    if (!state.sideShelf) {
      // Без боковой полки: от левой боковины до правой боковины
      divShelfLeft = mainX + ftPx;
      divShelfRight = mainX + cabW - ftPx;
    } else if (state.sideShelfSide === 'left') {
      // Боковая слева: от внешней левой боковины до правой боковины основной секции
      divShelfLeft = sideX + ftPx;
      divShelfRight = mainX + cabW - ftPx;
    } else {
      // Боковая справа: от левой боковины основной секции до внешней правой боковины
      divShelfLeft = mainX + ftPx;
      divShelfRight = sideX + sideW - ftPx;
    }

    const divShelfW = divShelfRight - divShelfLeft;
    parts.push(rect(divShelfLeft, doorBottomY - stPx / 2, divShelfW, stPx,
      ldspColor, darken(ldspColor, 25), 0.9));

    // Подпись «открытая полка» — по центру всей нижней зоны
    const openZoneCenterY = doorBottomY + bottomOpenPx / 2;
    const openZoneCenterX = (divShelfLeft + divShelfRight) / 2;
    parts.push(dimText(openZoneCenterX, openZoneCenterY,
      `${bottomOpenCm.toFixed(1)} см`, '#888', 11, 'middle', 0));
  }

  // --- ПОЛКИ (за створками) — в зоне створок ---
  const shelfCount = state.shelves;
  if (shelfCount > 0) {
    const segments = shelfCount + 1;
    for (let i = 1; i <= shelfCount; i++) {
      const shelfY = doorTopY + (doorHpx / segments) * i - stPx / 2;
      parts.push(rect(mainX + ftPx, shelfY, cabW - 2 * ftPx, stPx,
        ldspColor, darken(ldspColor, 25), 0.8));
    }
  }

  // --- СТВОРКИ ---
  const doorCount = state.doors;
  const doorGapPx = 2;
  const totalDoorW = cabW - 2 * ftPx - (doorCount - 1) * doorGapPx;
  const singleDoorW = totalDoorW / doorCount;

  for (let i = 0; i < doorCount; i++) {
    const doorX = mainX + ftPx + i * (singleDoorW + doorGapPx);

    if (state.doorType === 'ldsp') {
      parts.push(rect(doorX, doorTopY, singleDoorW, doorHpx,
        ldspColor, darken(ldspColor, 40), 0.85));
      const handleW = 3, handleH = 20;
      const handleX = (i % 2 === 0) ? doorX + singleDoorW - handleW - 8 : doorX + 8;
      const handleY = doorTopY + doorHpx / 2 - handleH / 2;
      parts.push(rect(handleX, handleY, handleW, handleH, darken(ldspColor, 60), 'none', 1));
    } else {
      const frameW = 3;
      const lamelH = 4, lamelGap = 3;
      const lamelArea = doorHpx - 2 * frameW;
      const lamelCount = Math.floor(lamelArea / (lamelH + lamelGap));
      const lamelStartY = doorTopY + frameW;

      for (let j = 0; j < lamelCount; j++) {
        const ly = lamelStartY + j * (lamelH + lamelGap);
        parts.push(rect(doorX + frameW, ly, singleDoorW - 2 * frameW, lamelH,
          frameColor, darken(frameColor, 25), 0.9));
      }

      parts.push(rect(doorX, doorTopY, singleDoorW, frameW, frameColor, darken(frameColor, 30), 1));
      parts.push(rect(doorX, doorTopY + doorHpx - frameW, singleDoorW, frameW, frameColor, darken(frameColor, 30), 1));
      parts.push(rect(doorX, doorTopY, frameW, doorHpx, frameColor, darken(frameColor, 30), 1));
      parts.push(rect(doorX + singleDoorW - frameW, doorTopY, frameW, doorHpx, frameColor, darken(frameColor, 30), 1));
    }
  }

  // ==============================
  // БОКОВАЯ ОТКРЫТАЯ ПОЛКА
  // ==============================
  if (state.sideShelf) {
    const sideShelfWpx = state.sideShelfWidth * scale;

    // Высота боковой секции: от верха до разделительной полки (зона створок) 
    // Боковая секция идёт только в зоне створок, ниже — общая открытая полка
    const sideTopY = startY;
    // Если есть нижняя открытая полка, боковая секция заканчивается на уровне разделительной полки
    const sideBottomY = (bottomOpenCm > 1) ? doorBottomY : startY + cabH;
    const sideSectionH = sideBottomY - sideTopY;

    if (state.sideShelfSide === 'left') {
      // Внешняя боковина
      parts.push(rect(sideX, sideTopY, ftPx, sideSectionH, frameColor, darken(frameColor, 30), 1));
      // Верхняя крышка боковой секции
      parts.push(rect(sideX + ftPx, sideTopY, sideShelfWpx, ftPx, frameColor, darken(frameColor, 30), 1));

      // Нижняя крышка боковой секции (если нет нижней открытой полки)
      if (bottomOpenCm <= 1) {
        parts.push(rect(sideX + ftPx, sideTopY + sideSectionH - ftPx, sideShelfWpx, ftPx, frameColor, darken(frameColor, 30), 1));
      }

      // Если есть нижняя открытая полка — боковина продолжается вниз
      if (bottomOpenCm > 1) {
        parts.push(rect(sideX, sideBottomY, ftPx, startY + cabH - sideBottomY, frameColor, darken(frameColor, 30), 1));
        // Нижняя планка всей конструкции (боковая часть)
        parts.push(rect(sideX + ftPx, startY + cabH - ftPx, sideShelfWpx + dtPx, ftPx, frameColor, darken(frameColor, 30), 1));
      }
    } else {
      // Внешняя боковина (справа)
      const outerSideX = sideX + sideW - ftPx;
      parts.push(rect(outerSideX, sideTopY, ftPx, sideSectionH, frameColor, darken(frameColor, 30), 1));
      // Верхняя крышка
      parts.push(rect(sideX + dtPx, sideTopY, sideShelfWpx, ftPx, frameColor, darken(frameColor, 30), 1));

      if (bottomOpenCm <= 1) {
        parts.push(rect(sideX + dtPx, sideTopY + sideSectionH - ftPx, sideShelfWpx, ftPx, frameColor, darken(frameColor, 30), 1));
      }

      if (bottomOpenCm > 1) {
        parts.push(rect(outerSideX, sideBottomY, ftPx, startY + cabH - sideBottomY, frameColor, darken(frameColor, 30), 1));
        parts.push(rect(sideX, startY + cabH - ftPx, sideShelfWpx + dtPx, ftPx, frameColor, darken(frameColor, 30), 1));
      }
    }

    // Полки в боковой секции (только в зоне створок, выше разделительной полки)
    const sideInnerTop = sideTopY + ftPx;
    const sideInnerH = sideSectionH - 2 * ftPx;
    // Если нижняя открытая полка есть, не вычитаем нижний ftPx (т.к. нет нижней крышки боковой)
    const sideInnerHActual = (bottomOpenCm > 1) ? sideSectionH - ftPx - stPx / 2 : sideInnerH;
    const sideShelfCount = state.sideShelves;
    const sideSegments = sideShelfCount + 1;

    for (let i = 1; i <= sideShelfCount; i++) {
      const sy = sideInnerTop + (sideInnerHActual / sideSegments) * i - stPx / 2;
      if (state.sideShelfSide === 'left') {
        parts.push(rect(sideX + ftPx, sy, sideShelfWpx, stPx,
          ldspColor, darken(ldspColor, 25), 0.8));
      } else {
        parts.push(rect(sideX + dtPx, sy, sideShelfWpx, stPx,
          ldspColor, darken(ldspColor, 25), 0.8));
      }
    }
  }

  // ==============================
  // РАЗМЕРНЫЕ ЛИНИИ
  // ==============================
  const dimOff = S.dimLineOffset;
  const dimCol = S.dimColor;
  const fontSize = S.dimFontSize;

  // Высота (справа от всей конструкции)
  const rightEdge = startX + totalW;
  parts.push(dimLine(rightEdge + gap + dimOff, startY, rightEdge + gap + dimOff, startY + cabH, dimCol));
  parts.push(dimArrow(rightEdge + gap + dimOff, startY, 'up', dimCol));
  parts.push(dimArrow(rightEdge + gap + dimOff, startY + cabH, 'down', dimCol));
  parts.push(dimText(rightEdge + gap + dimOff + 6, startY + cabH / 2,
    state.height + ' см', dimCol, fontSize, 'start', -90));

  // Общая ширина (сверху)
  parts.push(dimLine(startX, startY - gap - dimOff, startX + totalW, startY - gap - dimOff, dimCol));
  parts.push(dimArrow(startX, startY - gap - dimOff, 'left', dimCol));
  parts.push(dimArrow(startX + totalW, startY - gap - dimOff, 'right', dimCol));
  parts.push(dimText(startX + totalW / 2, startY - gap - dimOff - 6,
    totalWidthCm + ' см', dimCol, fontSize, 'middle', 0));

  // Отдельные размеры основной и боковой секции
  if (state.sideShelf) {
    const dimY2 = startY - gap - dimOff - 24;

    // Основная секция
    parts.push(dimLine(mainX, dimY2, mainX + cabW, dimY2, '#999'));
    parts.push(dimArrow(mainX, dimY2, 'left', '#999'));
    parts.push(dimArrow(mainX + cabW, dimY2, 'right', '#999'));
    parts.push(dimText(mainX + cabW / 2, dimY2 - 6,
      state.width + ' см', '#999', 11, 'middle', 0));

    // Боковая
    const sideStartX2 = sideX;
    const sideEndX = sideStartX2 + sideW;
    parts.push(dimLine(sideStartX2, dimY2, sideEndX, dimY2, '#999'));
    parts.push(dimArrow(sideStartX2, dimY2, 'left', '#999'));
    parts.push(dimArrow(sideEndX, dimY2, 'right', '#999'));
    parts.push(dimText((sideStartX2 + sideEndX) / 2, dimY2 - 6,
      (state.sideShelfWidth + CONFIG.dividerThickness).toFixed(1) + '', '#999', 11, 'middle', 0));
  }

  // Высота створок (слева от основной секции)
  if (bottomOpenCm > 1) {
    const leftEdge = mainX;
    const dlX = leftEdge - gap - dimOff;
    parts.push(dimLine(dlX, doorTopY, dlX, doorBottomY, '#4a7c59'));
    parts.push(dimArrow(dlX, doorTopY, 'up', '#4a7c59'));
    parts.push(dimArrow(dlX, doorBottomY, 'down', '#4a7c59'));
    parts.push(dimText(dlX - 6, doorTopY + doorHpx / 2,
      state.doorHeight + '', '#4a7c59', 11, 'end', -90));
  }

  svg.innerHTML = parts.join('\n');
}

// SVG-хелперы
function rect(x, y, w, h, fill, stroke, strokeWidth, fillAlt, opacity) {
  const f = fill || 'none';
  const s = stroke || 'none';
  const sw = strokeWidth || 0;
  const op = opacity !== undefined ? ` opacity="${opacity}"` : '';
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" stroke="${s}" stroke-width="${sw}"${op} />`;
}

function dimLine(x1, y1, x2, y2, color) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="1" stroke-dasharray="4 2" />`;
}

function dimArrow(x, y, dir, color) {
  const s = 5;
  let points;
  switch (dir) {
    case 'up':    points = `${x},${y} ${x-s},${y+s*1.5} ${x+s},${y+s*1.5}`; break;
    case 'down':  points = `${x},${y} ${x-s},${y-s*1.5} ${x+s},${y-s*1.5}`; break;
    case 'left':  points = `${x},${y} ${x+s*1.5},${y-s} ${x+s*1.5},${y+s}`; break;
    case 'right': points = `${x},${y} ${x-s*1.5},${y-s} ${x-s*1.5},${y+s}`; break;
  }
  return `<polygon points="${points}" fill="${color}" />`;
}

function dimText(x, y, text, color, size, anchor, rotate) {
  const transform = rotate ? ` transform="rotate(${rotate} ${x} ${y})"` : '';
  return `<text x="${x}" y="${y}" fill="${color}" font-size="${size}" font-family="sans-serif" text-anchor="${anchor}" dominant-baseline="middle"${transform}>${text}</text>`;
}

function darken(hex, amount) {
  if (!hex || hex === 'none') return '#000';
  let r = parseInt(hex.slice(1,3), 16);
  let g = parseInt(hex.slice(3,5), 16);
  let b = parseInt(hex.slice(5,7), 16);
  r = Math.max(0, r - amount);
  g = Math.max(0, g - amount);
  b = Math.max(0, b - amount);
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

function getFrameHex() {
  return CONFIG.frameColors.find(c => c.id === state.frameColorId)?.hex || '#E8D5A3';
}
function getLdspHex() {
  return CONFIG.ldspColors.find(c => c.id === state.ldspColorId)?.hex || '#F5F5F0';
}
function getFrameName() {
  return CONFIG.frameColors.find(c => c.id === state.frameColorId)?.name || '';
}
function getLdspName() {
  return CONFIG.ldspColors.find(c => c.id === state.ldspColorId)?.name || '';
}

// ============================================================
// РАСЧЁТ ЦЕНЫ (заглушка)
// ============================================================
function calculatePrice() {
  const P = CONFIG.prices;
  const h = state.height / 100;
  const w = state.width / 100;
  const d = state.depth / 100;
  const ft = CONFIG.frameThickness / 100;

  // Каркас основной: 2 боковины + верх + низ
  const frameSides = 2 * h * d;
  const frameTopBot = 2 * (w - 2 * ft) * d;
  let frameArea = frameSides + frameTopBot;

  let sideShelvesPrice = 0;
  if (state.sideShelf) {
    const sw = state.sideShelfWidth / 100;
    frameArea += h * d; // внешняя боковина
    frameArea += 2 * sw * d; // верх + низ боковой секции
    const sideShelfArea = sw * d;
    sideShelvesPrice = state.sideShelves * sideShelfArea * P.ldspPerM2;
  }
  const framePrice = frameArea * P.framePerM2;

  // Полки основные
  const shelfW = w - 2 * ft;
  const shelfArea = shelfW * d;
  const shelvesPrice = state.shelves * shelfArea * P.ldspPerM2;

  // Задняя стенка
  const backW = w - 2 * ft;
  const backH = h - 2 * ft;
  let backArea = backW * backH;
  if (state.sideShelf) {
    const sw = state.sideShelfWidth / 100;
    backArea += sw * backH;
  }
  const backPrice = backArea * P.dvpPerM2;

  // Створки
  let doorsPrice = 0;
  const doorW = (w - 2 * ft) / state.doors;
  const doorH = state.doorHeight / 100;

  if (state.doorType === 'ldsp') {
    doorsPrice = state.doors * doorW * doorH * P.ldspPerM2;
  } else {
    doorsPrice = state.doors * (P.jaluziPerDoor + doorW * doorH * P.jaluziPerM2 * 0.3);
  }

  const assemblyPrice = P.assembly;
  const total = framePrice + shelvesPrice + sideShelvesPrice + backPrice + doorsPrice + assemblyPrice;

  return {
    frame: Math.round(framePrice),
    shelves: Math.round(shelvesPrice),
    sideShelves: Math.round(sideShelvesPrice),
    back: Math.round(backPrice),
    doors: Math.round(doorsPrice),
    assembly: Math.round(assemblyPrice),
    total: Math.round(total),
  };
}

function renderPrice() {
  const p = calculatePrice();
  const doorTypeLabel = state.doorType === 'ldsp' ? 'ЛДСП' : 'Жалюзи';

  let lines = `
    <h3>Расчёт стоимости</h3>
    <div class="price-line"><span>Каркас (${getFrameName()})</span><span>${fmt(p.frame)} ₽</span></div>
    <div class="price-line"><span>Полки × ${state.shelves} (${getLdspName()})</span><span>${fmt(p.shelves)} ₽</span></div>`;

  if (state.sideShelf && p.sideShelves > 0) {
    lines += `<div class="price-line"><span>Полки боковые × ${state.sideShelves}</span><span>${fmt(p.sideShelves)} ₽</span></div>`;
  }

  lines += `
    <div class="price-line"><span>Задняя стенка</span><span>${fmt(p.back)} ₽</span></div>
    <div class="price-line"><span>Створки × ${state.doors} (${doorTypeLabel})</span><span>${fmt(p.doors)} ₽</span></div>
    <div class="price-line"><span>Сборка и установка</span><span>${fmt(p.assembly)} ₽</span></div>
    <div class="price-total"><span>Итого</span><span>${fmt(p.total)} ₽</span></div>`;

  document.getElementById('priceBlock').innerHTML = lines;
}

function fmt(n) {
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

// ============================================================
// МОДАЛЬНОЕ ОКНО
// ============================================================
function openModal() {
  document.getElementById('modalOverlay').classList.add('show');
  const p = calculatePrice();
  const doorTypeLabel = state.doorType === 'ldsp' ? 'ЛДСП' : 'Жалюзи';
  let configText = `${state.width}×${state.height}×${state.depth} см | ${state.shelves} полок | ${state.doors} створок (${doorTypeLabel}) h=${state.doorHeight}см`;
  if (state.sideShelf) {
    configText += ` | боковая полка ${state.sideShelfSide === 'left' ? 'слева' : 'справа'} ${state.sideShelfWidth}см (${state.sideShelves} полок)`;
  }
  configText += ` | ${getFrameName()} + ${getLdspName()} | ${fmt(p.total)} ₽`;
  document.getElementById('modalConfig').textContent = configText;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function sendOrder() {
  const name = document.getElementById('inputName').value.trim();
  const phone = document.getElementById('inputPhone').value.trim();
  const comment = document.getElementById('inputComment').value.trim();

  if (!name || !phone) {
    alert('Пожалуйста, укажите имя и телефон.');
    return;
  }

  const p = calculatePrice();

  const payload = {
    name, phone, comment,
    config: {
      height: state.height,
      width: state.width,
      depth: state.depth,
      shelves: state.shelves,
      doors: state.doors,
      doorType: state.doorType,
      doorHeight: state.doorHeight,
      ldspColor: state.ldspColorId,
      ldspColorName: getLdspName(),
      frameColor: state.frameColorId,
      frameColorName: getFrameName(),
      sideShelf: state.sideShelf,
      sideShelfSide: state.sideShelfSide,
      sideShelfWidth: state.sideShelfWidth,
      sideShelves: state.sideShelves,
    },
    price: p,
    timestamp: new Date().toISOString(),
  };

  console.log('📤 Отправка заявки:', payload);

  fetch(CONFIG.orderEndpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })
  .then(res => {
    if (res.ok) {
      alert('Заявка отправлена! Я свяжусь с вами в ближайшее время.');
    } else {
      alert('Заявка сформирована (сервер пока не подключён). Данные в консоли.');
    }
    closeModal();
  })
  .catch(() => {
    alert('Заявка сформирована (сервер не доступен). Данные в консоли (F12).');
    closeModal();
  });
}
</script>
</body>
</html>
